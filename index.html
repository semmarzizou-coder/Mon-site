<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon site</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #dff6ff, #ffffff);
      color: #123;
    }

    .container {
      padding: 80px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      margin-bottom: 35px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: #123b5d;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d5c8a;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Bienvenue sur mon site 👋</h1>

    <p>Mon premier site web créé sur Android.</p>

    <button onclick="alert('Merci de visiter mon site ! 😊')">
      Cliquez ici
    </button>
  </div>

</body>
</html>
